<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#0a0c10"/>
  <rect x="70" y="80" width="280" height="240" rx="14" fill="#12161d" stroke="#8a95a6" stroke-width="2"/>
  <text x="210" y="120" text-anchor="middle" font-family="monospace" font-size="16" fill="#8a95a6">app.js</text>
  <line x1="90" y1="140" x2="330" y2="140" stroke="#222a36" stroke-width="1"/>
  <text x="90" y="175" font-family="monospace" font-size="14" fill="#8a95a6">function greet(user) {</text>
  <text x="90" y="200" font-family="monospace" font-size="14" fill="#8a95a6">  return user.name;</text>
  <text x="90" y="225" font-family="monospace" font-size="14" fill="#8a95a6">}</text>
  <rect x="450" y="80" width="280" height="240" rx="14" fill="#12161d" stroke="#ffb454" stroke-width="2"/>
  <text x="590" y="120" text-anchor="middle" font-family="monospace" font-size="16" fill="#ffb454">app.ts</text>
  <line x1="470" y1="140" x2="710" y2="140" stroke="#222a36" stroke-width="1"/>
  <text x="470" y="175" font-family="monospace" font-size="14" fill="#ffb454">interface User {</text>
  <text x="470" y="200" font-family="monospace" font-size="14" fill="#ffb454">  name: string;</text>
  <text x="470" y="225" font-family="monospace" font-size="14" fill="#ffb454">}</text>
  <text x="470" y="250" font-family="monospace" font-size="14" fill="#ffb454">greet(user: User): string</text>
  <path d="M 355,200 L 445,200" stroke="#ffb454" stroke-width="3" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ffb454"/>
    </marker>
  </defs>
  <text x="400" y="360" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#8a95a6" letter-spacing="4">JS + TYPES</text>
</svg>
