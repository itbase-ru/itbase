<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
<defs>
<linearGradient id="rr" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#10050f"/><stop offset="1" stop-color="#280f28"/>
</linearGradient>
</defs>
<rect width="1200" height="675" fill="url(#rr)"/>
<!-- Полоса с совпадениями -->
<rect x="100" y="240" width="1000" height="80" rx="10" fill="#12161d" stroke="#222a36" stroke-width="2"/>
<g fill="#c084fc" font-family="monospace" font-size="30">
<text x="130" y="290">user_42@mail.ru   admin@site.com   not-an-email</text>
</g>
<!-- Выделенные совпадения -->
<rect x="125" y="252" width="180" height="56" rx="6" fill="none" stroke="#c084fc" stroke-width="3"/>
<rect x="330" y="252" width="200" height="56" rx="6" fill="none" stroke="#c084fc" stroke-width="3"/>
<!-- Regex-паттерн -->
<rect x="100" y="400" width="1000" height="100" rx="10" fill="#1a0f1e" stroke="#c084fc" stroke-width="2"/>
<text x="130" y="465" fill="#c084fc" font-family="monospace" font-size="36">/^[\\w.-]+@[\\w.-]+\\.[a-z]{2,}$/i</text>
<text x="60" y="120" fill="#e9eef5" font-family="Georgia, serif" font-size="72" font-weight="700">Regex</text>
<text x="60" y="170" fill="#c084fc" font-family="monospace" font-size="18" letter-spacing="4">// РЕГУЛЯРНЫЕ ВЫРАЖЕНИЯ</text>
<text x="60" y="600" fill="#8a95a6" font-family="monospace" font-size="20">regex101.com — проверяй здесь</text>
</svg>
