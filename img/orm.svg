  <text x="500" y="250" font-family="monospace" font-size="13" fill="#8a95a6">email varchar</text>
  <path d="M 325,200 L 475,200" stroke="#ffb454" stroke-width="3" marker-end="url(#ar)"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
