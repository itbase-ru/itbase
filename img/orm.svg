  <text x="200" y="155" text-anchor="middle" font-family="monospace" font-size="16" fill="#8a95a6">class User</text>
  <line x1="100" y1="175" x2="300" y2="175" stroke="#222a36" stroke-width="1"/>
  <text x="100" y="200" font-family="monospace" font-size="13" fill="#e9eef5">id: int</text>
  <text x="100" y="225" font-family="monospace" font-size="13" fill="#e9eef5">name: str</text>
  <text x="100" y="250" font-family="monospace" font-size="13" fill="#e9eef5">email: str</text>
  <rect x="480" y="120" width="240" height="160" rx="14" fill="#12161d" stroke="#ffb454" stroke-width="2"/>
