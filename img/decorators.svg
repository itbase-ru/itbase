<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#0a0c10"/>
  <text x="170" y="215" text-anchor="middle" font-family="monospace" font-size="18" fill="#ffb454">@decorator</text>
  <path d="M 320,200 L 380,200" stroke="#ffb454" stroke-width="3" marker-end="url(#ar)"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ffb454"/>
    </marker>
  </defs>
  <rect x="400" y="160" width="240" height="80" rx="12" fill="#12161d" stroke="#8a95a6" stroke-width="2"/>
  <text x="520" y="200" text-anchor="middle" font-family="monospace" font-size="16" fill="#8a95a6">def my_func()</text>
  <text x="520" y="222" text-anchor="middle" font-family="monospace" font-size="14" fill="#8a95a6">...</text>
  <text x="400" y="300" text-anchor="middle" font-family="monospace" font-size="14" fill="#8a95a6">wrapper → func(*args, **kwargs)</text>
  <text x="400" y="360" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#8a95a6" letter-spacing="4">PYTHON DECORATORS</text>
</svg>
