<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#0a0c10"/>
  <rect x="60" y="120" width="200" height="160" rx="12" fill="#12161d" stroke="#8a95a6" stroke-width="2"/>
  <text x="160" y="160" text-anchor="middle" font-family="monospace" font-size="16" fill="#8a95a6">Cookie</text>
  <line x1="80" y1="180" x2="240" y2="180" stroke="#222a36" stroke-width="1"/>
  <text x="160" y="205" text-anchor="middle" font-family="monospace" font-size="12" fill="#e9eef5">~4 KB</text>
  <text x="160" y="230" text-anchor="middle" font-family="monospace" font-size="12" fill="#e9eef5">→ сервер</text>
  <rect x="300" y="120" width="200" height="160" rx="12" fill="#12161d" stroke="#ffb454" stroke-width="2"/>
  <text x="400" y="160" text-anchor="middle" font-family="monospace" font-size="14" fill="#ffb454">localStorage</text>
  <line x1="320" y1="180" x2="480" y2="180" stroke="#222a36" stroke-width="1"/>
  <text x="400" y="205" text-anchor="middle" font-family="monospace" font-size="12" fill="#e9eef5">5-10 MB</text>
  <text x="400" y="230" text-anchor="middle" font-family="monospace" font-size="12" fill="#e9eef5">постоянно</text>
  <rect x="540" y="120" width="200" height="160" rx="12" fill="#12161d" stroke="#8a95a6" stroke-width="2"/>
  <text x="640" y="160" text-anchor="middle" font-family="monospace" font-size="13" fill="#8a95a6">sessionStorage</text>
  <line x1="560" y1="180" x2="720" y2="180" stroke="#222a36" stroke-width="1"/>
  <text x="640" y="205" text-anchor="middle" font-family="monospace" font-size="12" fill="#e9eef5">5-10 MB</text>
  <text x="640" y="230" text-anchor="middle" font-family="monospace" font-size="12" fill="#e9eef5">до закрытия</text>
  <text x="400" y="350" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#8a95a6" letter-spacing="4">BROWSER STORAGE</text>
</svg>
